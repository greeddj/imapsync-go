src:
  label: old
  server: mail.oldhost.com:993
  user: user@oldhost.com
  pass: password
  auth: login # optional ( login | cram-md5 )

dst:
  label: new
  server: imap.newhost.com:993
  user: user@newhost.com
  pass: password
  auth: login # optional ( login | cram-md5 )

map:
  - src: INBOX
    dst: INBOX
  - src: Sent
    dst: Sent
  - src: Archive.2023
    dst: Archive/2023

# Optional throttle. A value of 0, or no value, removes the limit.
# A rate limit only spreads the transfer over time.
# Gmail has daily IMAP quotas of 2500 MB download and 500 MB upload
# for each account. For Gmail, set down_bps to 27000 and up_bps to
# 5000, so a non-stop run stays below the quotas. A higher rate gets
# to a quota sooner. The server then refuses and sync stops. A later
# run continues where it stopped.
# Set max_connections to 10 or less. Gmail allows 15 IMAP sessions
# at the same time for each account.
rate_limit:
  down_bps: 0
  up_bps: 0
  max_connections: 0
